<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Mbongo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .login-page { 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: "€ £ FCFA € £ FCFA € £ FCFA € £ FCFA";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 20px;
            line-height: 80px;
            word-spacing: 30px;
            color: rgba(255, 215, 0, 0.15);
            z-index: 1;
            pointer-events: none;
            transform: rotate(-15deg);
            animation: float 60s linear infinite;
        }
        @keyframes float {
            0% { transform: rotate(-15deg) translateX(0); }
            100% { transform: rotate(-15deg) translateX(-200px); }
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
        }
        h2 { 
            color: white; 
            font-size: 28px; 
            text-align: center; 
            margin-bottom: 8px; 
        }
        p { 
            color: rgba(255, 255, 255, 0.7); 
            text-align: center; 
            margin-bottom: 32px; 
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }
    </style>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Simulation de connexion réussie
                alert('Connexion réussie !');
                // Redirection vers tableau de bord (à implémenter)
                window.location.href = '/dashboard.html';
            } else {
                alert('Veuillez saisir vos identifiants');
            }
        }
    </script>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h2>Connexion</h2>
            <p>Accédez à votre compte Mbongo</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Nom d utilisateur</label>
                    <input type="text" id="username" placeholder="Entrez votre nom" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
                </div>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>
